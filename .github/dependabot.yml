version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/play-store-mcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /play-store-mcp
    schedule:
      interval: weekly

  - package-ecosystem: "npm"
    directory: "/antigravity-pm-mcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
