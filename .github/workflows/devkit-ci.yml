name: Universal Agent DevKit CI

on:
  push:
    branches: [main]
    paths:
      - "universal-agent-devkit/**"
      - ".github/workflows/devkit-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "universal-agent-devkit/**"
      - ".github/workflows/devkit-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: universal-agent-devkit

jobs:
  test-matrix:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Node 20 reached end-of-life in April 2026; 22 is the maintained LTS.
          # workflows/*.test.mjs pass on both (134/134 locally on 20.20.2 and 22.23.2).
          node-version: "22"

      # tests/test_repo_consistency.sh checks skill/agent YAML frontmatter strictly with
      # ruby when present (GitHub's ubuntu and macos images ship it) and falls back to a
      # line-based check otherwise; print which one this runner gets.
      - name: Tool versions
        run: |
          python3 --version
          node --version
          bash --version | head -1
          if command -v ruby >/dev/null 2>&1; then ruby --version; else echo "ruby: not installed (frontmatter check uses the fallback parser)"; fi

      - name: Syntax & Compilation Check
        run: |
          shopt -s nullglob
          py_files=(bin/*.py scripts/*.py)
          python3 -m py_compile "${py_files[@]}"
          for f in bin/agent-kit bin/install.sh bin/quick-install.sh hooks/*.sh hooks/tests/*.sh scripts/*.sh adapters/*.sh tests/*.sh; do
            bash -n "$f" || { echo "bash -n failed: $f"; exit 1; }
          done

      - name: Agent Health (configuration checks)
        run: python3 bin/agent-health.py

      # post-fix-gate.py is not run bare here: on a clean checkout it has nothing to
      # audit and exits 3 by design. Its behaviour is covered by tests/test_postfix_gate.sh.
      - name: Run all test suites (agent-kit test)
        run: bash bin/agent-kit test
